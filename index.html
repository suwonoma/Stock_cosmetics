<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="일본 화장품 산업 대시보드 - 주요 일본 화장품 기업의 뉴스, 주가, AI 연구 추적">
    <title>일본 화장품 산업 대시보드</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-flask"></i>
                    <h1>일본 화장품 산업 대시보드</h1>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="btn-icon" aria-label="테마 전환">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="news">
                    <i class="fas fa-newspaper"></i>
                    <span>최신 뉴스</span>
                </button>
                <button class="tab-btn" data-tab="stocks">
                    <i class="fas fa-chart-line"></i>
                    <span>주가 차트</span>
                </button>
                <button class="tab-btn" data-tab="papers">
                    <i class="fas fa-graduation-cap"></i>
                    <span>AI 연구</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- News Section -->
            <section id="newsSection" class="content-section active">
                <div class="section-header">
                    <h2>최신 산업 뉴스</h2>
                    <div class="controls">
                        <select id="companyFilter" class="select-dropdown">
                            <option value="all">전체 회사</option>
                        </select>
                        <select id="categoryFilter" class="select-dropdown">
                            <option value="all">전체 카테고리</option>
                            <option value="product">신제품</option>
                            <option value="financial">재무실적</option>
                            <option value="ma">M&A</option>
                            <option value="rd">연구개발</option>
                            <option value="esg">ESG</option>
                        </select>
                        <button id="refreshNews" class="btn-primary">
                            <i class="fas fa-sync-alt"></i> 새로고침
                        </button>
                    </div>
                </div>

                <div id="newsLoading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>뉴스 로딩 중...</p>
                </div>

                <div id="newsError" class="error-message hidden"></div>

                <div id="newsGrid" class="news-grid">
                    <!-- 뉴스 카드가 동적으로 삽입됩니다 -->
                </div>
            </section>

            <!-- Stocks Section -->
            <section id="stocksSection" class="content-section">
                <div class="section-header">
                    <h2>주가 차트</h2>
                    <div class="controls">
                        <select id="stockCompany" class="select-dropdown">
                            <option value="">회사 선택</option>
                        </select>
                        <div class="period-buttons">
                            <button class="period-btn" data-period="1W">1주</button>
                            <button class="period-btn" data-period="1M">1개월</button>
                            <button class="period-btn active" data-period="3M">3개월</button>
                            <button class="period-btn" data-period="6M">6개월</button>
                            <button class="period-btn" data-period="1Y">1년</button>
                            <button class="period-btn" data-period="YTD">연초대비</button>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="compareMode">
                            비교 모드 (최대 4개)
                        </label>
                    </div>
                </div>

                <div id="stockInfo" class="stock-info hidden">
                    <div class="stock-card">
                        <div class="stock-label">현재가</div>
                        <div id="currentPrice" class="stock-value">-</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-label">변동</div>
                        <div id="priceChange" class="stock-value">-</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-label">거래량</div>
                        <div id="volume" class="stock-value">-</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-label">52주 최고</div>
                        <div id="high52w" class="stock-value">-</div>
                    </div>
                    <div class="stock-card">
                        <div class="stock-label">52주 최저</div>
                        <div id="low52w" class="stock-value">-</div>
                    </div>
                </div>

                <div id="compareSelect" class="compare-select hidden">
                    <p>비교할 회사를 최대 4개까지 선택하세요:</p>
                    <div id="compareCheckboxes" class="compare-checkboxes"></div>
                    <button id="loadCompare" class="btn-primary">비교 차트 로드</button>
                </div>

                <div id="stockLoading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>주가 데이터 로딩 중...</p>
                </div>

                <div id="stockError" class="error-message hidden"></div>

                <div class="chart-container">
                    <canvas id="stockChart"></canvas>
                </div>
            </section>

            <!-- Papers Section -->
            <section id="papersSection" class="content-section">
                <div class="section-header">
                    <h2>AI & 화장품 연구 논문</h2>
                    <div class="controls">
                        <input type="text" id="paperSearch" class="search-input" placeholder="논문 검색...">
                        <select id="yearFilter" class="select-dropdown">
                            <option value="all">전체 연도</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                        </select>
                        <button id="refreshPapers" class="btn-primary">
                            <i class="fas fa-sync-alt"></i> 새로고침
                        </button>
                    </div>
                </div>

                <div id="papersLoading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>연구 논문 로딩 중...</p>
                </div>

                <div id="papersError" class="error-message hidden"></div>

                <div id="papersGrid" class="papers-grid">
                    <!-- 논문 카드가 동적으로 삽입됩니다 -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 일본 화장품 산업 대시보드. 데이터 출처: NewsAPI, Alpha Vantage, arXiv</p>
            <p class="disclaimer">이 대시보드는 정보 제공 목적으로만 사용됩니다. 모든 데이터를 독립적으로 검증하시기 바랍니다.</p>
        </div>
    </footer>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
